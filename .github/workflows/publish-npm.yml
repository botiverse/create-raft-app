name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Package version expected in package.json, for example 0.1.0"
        required: true
        type: string
      dry_run:
        description: "Run npm publish --dry-run instead of publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish create-raft-app
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Verify package version
        run: |
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "${{ inputs.expected_version }}" ]; then
            echo "package.json version $actual does not match expected ${{ inputs.expected_version }}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify legacy branding is absent
        run: |
          legacy_pattern='slo''ck'
          if grep -R -n -i --exclude-dir=.git --exclude=package-lock.json "$legacy_pattern" .; then
            echo "legacy branding must not be published" >&2
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Check publish status
        id: publish-status
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check version is not already published
        if: ${{ !inputs.dry_run }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "${{ steps.publish-status.outputs.published }}" = "true" ]; then
            echo "$name@$version is already published; refusing to overwrite" >&2
            exit 1
          fi

      - name: Publish dry run
        if: ${{ inputs.dry_run && steps.publish-status.outputs.published == 'false' }}
        run: npm publish --access public --dry-run

      - name: Already published dry run
        if: ${{ inputs.dry_run && steps.publish-status.outputs.published == 'true' }}
        run: echo "Package version is already published; npm pack --dry-run above verified package contents."

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        # npm provenance currently requires the GitHub source repository to be public.
        run: npm publish --access public --provenance=false
